  - fixed obstacles in the central family activity field
layout_priorities:
- preserve the existing 850 mm north-balcony opening without worsening it
- retain the kitchen and all walls/openings/stair/ramp
- keep the G-DIN-LIV transition usable
- support four daily dining seats close to the KEEP kitchen
- prioritize a clear family conversation group and useful negative space
- allow child activity and elder-friendly circulation
