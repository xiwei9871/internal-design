narrative: A public zone shared every day by the owner and mother, with wife, child,
  relatives and guests joining periodically. The plan must support conversation, child
  activity, dining for four, projector use, and comfortable movement through the retained
  split-level structure.
style:
  primary: not assessed in D1 layout experiment
  secondary: []
